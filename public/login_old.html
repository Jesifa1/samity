<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<style>
  body { font-family: system-ui, sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; }
  form { display: flex; flex-direction: column; gap: 10px; width: 260px; }
  input, button { padding: 8px; font-size: 15px; }
  #err { color: #b00020; min-height: 1.2em; font-size: 14px; }
</style>
</head>
<body>
<form id="f">
  <h2>Samity Manager</h2>
  <input type="password" name="password" placeholder="Admin password" required autofocus>
  <button>Login</button>
  <div id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: e.target.password.value }),
  });
  if (res.ok) location.href = '/';
  else document.getElementById('err').textContent = (await res.json()).error;
});
</script>
</body>
</html>
